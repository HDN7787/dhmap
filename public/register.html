<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>用户注册 - 网址导航</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f7f9; padding: 40px; display: flex; justify-content: center; }
    .box { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.05); width: 100%; max-width: 400px; }
    h2 { margin-top: 0; text-align: center; }
    input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:disabled { background: #93c5fd; }
    .msg { text-align: center; margin-top: 15px; font-size: 14px; }
    .error { color: #b91c1c; }
    .success { color: #15803d; }
  </style>
</head>
<body>
  <div class="box">
    <h2>注册账号</h2>
    <form id="regForm">
      <input type="email" id="email" placeholder="邮箱" required />
      <input type="password" id="password" placeholder="密码（至少6位）" required minlength="6" />
      <!-- Turnstile 组件 -->
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAF5y5OVdV5PJTIkK" data-callback="onTurnstileSuccess"></div>
      <button type="submit" id="submitBtn" disabled>注册</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    let turnstileToken = '';
    // Turnstile 验证通过后的回调
    function onTurnstileSuccess(token) {
      turnstileToken = token;
      document.getElementById('submitBtn').disabled = false;
    }

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!turnstileToken) {
        msgEl.className = 'msg error';
        msgEl.textContent = '请先完成人机验证';
        return;
      }

      btn.disabled = true;
      msgEl.className = 'msg';
      msgEl.textContent = '正在注册…';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, turnstileToken })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '注册失败');

        msgEl.className = 'msg success';
        msgEl.textContent = '注册成功！即将跳转到首页…';
        setTimeout(() => location.href = '/', 1500);
      } catch (err) {
        msgEl.className = 'msg error';
        msgEl.textContent = err.message;
        btn.disabled = false;
        // 注册失败后需重置 Turnstile
        if (window.turnstile) window.turnstile.reset();
      }
    });
  </script>
</body>
</html>
