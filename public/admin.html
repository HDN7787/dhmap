<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>管理后台 - 导航map</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f7f9; padding: 20px; margin: 0; }
    .header-bar { max-width: 1200px; margin: 0 auto 10px; display: flex; justify-content: space-between; align-items: center; }
    .header-bar a { text-decoration: none; color: #2563eb; font-size: 14px; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    
    .tabs { display: flex; border-bottom: 1px solid #e5e7eb; margin-bottom: 20px; }
    .tab { padding: 12px 24px; cursor: pointer; font-size: 16px; font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
    .toolbar input { width: 300px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    th { background: #f9fafb; font-weight: 600; color: #374151; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 4px; }
    .btn-edit { background: #f59e0b; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn:hover { opacity: 0.8; }
    
    .tag { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: 500; }
    .tag-published { background: #d1fae5; color: #065f46; }
    .tag-rejected { background: #fee2e2; color: #991b1b; }
    .tag-inactive { background: #f3f4f6; color: #4b5563; }
    
    #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background:#fff; padding:20px; border-radius:8px; width: 400px; }
    .modal-content input, .modal-content textarea, .modal-content select { width:100%; margin-bottom:12px; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; }
  </style>
</head>
<body>
  <div class="header-bar">
    <a href="/">← 返回首页</a>
  </div>
  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('logs')">流水日志</div>
      <div class="tab" onclick="switchTab('sites')">已收录站点管理</div>
    </div>

    <div id="tab-logs">
      <div class="toolbar">
        <input type="text" id="logSearch" placeholder="搜索标题、网址、提交人..." />
        <select id="logStatus">
          <option value="">全部状态</option>
          <option value="published">已发布</option>
          <option value="rejected">验证失败</option>
        </select>
        <button class="btn btn-edit" onclick="loadLogs()">🔄 刷新</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>网站信息</th><th>来源</th><th>提交人</th><th>时间</th><th>状态</th></tr></thead>
        <tbody id="logList"></tbody>
      </table>
    </div>

    <div id="tab-sites" style="display:none;">
      <div class="toolbar">
        <input type="text" id="siteSearch" placeholder="搜索已收录站点..." />
        <select id="siteCat"><option value="">全部分类</option></select>
        <button class="btn btn-edit" onclick="loadSites()">🔄 刷新</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>标题 / URL</th><th>分类</th><th>当前状态</th><th>操作</th></tr></thead>
        <tbody id="siteList"></tbody>
      </table>
    </div>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h3>编辑站点信息</h3>
      <input type="hidden" id="editId">
      <label>标题</label>
      <input type="text" id="editTitle">
      <label>描述</label>
      <textarea id="editDesc" rows="3"></textarea>
      <label>分类</label>
      <select id="editCat"></select>
      <label>状态</label>
      <select id="editStatus">
        <option value="active">正常展示 (上架)</option>
        <option value="invalid">隐藏下架 (软删除)</option>
      </select>
      <div style="text-align:right; margin-top:10px;">
        <button class="btn" onclick="document.getElementById('modal').style.display='none'">取消</button>
        <button class="btn btn-success" onclick="saveEdit()">保存</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/login.html';
    let categories = [];

    async function init() {
      const cRes = await fetch('/api/categories', { cache: 'no-store' });
      categories = await cRes.json();
      
      const catOptions = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('siteCat').innerHTML = '<option value="">全部分类</option>' + catOptions;
      document.getElementById('editCat').innerHTML = catOptions;

      loadLogs();
      loadSites();
      
      document.getElementById('logSearch').addEventListener('input', renderLogs);
      document.getElementById('logStatus').addEventListener('change', renderLogs);
      document.getElementById('siteSearch').addEventListener('input', renderSites);
      document.getElementById('siteCat').addEventListener('change', renderSites);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-logs').style.display = tab === 'logs' ? 'block' : 'none';
      document.getElementById('tab-sites').style.display = tab === 'sites' ? 'block' : 'none';
    }

    // 流水日志
    let logData = [];
    async function loadLogs() {
      const res = await fetch('/api/admin/submissions', { 
        headers: { 'Authorization': 'Bearer ' + token },
        cache: 'no-store' // 强制防缓存
      });
      logData = await res.json();
      renderLogs();
    }
    function renderLogs() {
      const q = document.getElementById('logSearch').value.toLowerCase().trim();
      const s = document.getElementById('logStatus').value;
      let filtered = logData;
      if (q) filtered = filtered.filter(i => i.title.toLowerCase().includes(q) || i.url.toLowerCase().includes(q) || i.user_email.toLowerCase().includes(q));
      if (s) filtered = filtered.filter(i => i.status === s);
      
      document.getElementById('logList').innerHTML = filtered.map(item => `
        <tr>
          <td>${item.id}</td>
          <td><div style="font-weight:600;">${item.title}</div><div style="font-size:12px;color:#6b7280;">${item.url}</div></td>
          <td>${item.user_email === 'system@navmap.local' ? '🤖 自动' : '👤 用户'}</td>
          <td>${item.user_email}</td>
          <td>${new Date(item.created_at).toLocaleString()}</td>
          <td><span class="tag ${item.status === 'published' ? 'tag-published' : 'tag-rejected'}">${item.status === 'published' ? '已发布' : '已拒绝'}</span></td>
        </tr>`).join('');
    }

    // 站点管理
    let siteData = [];
    async function loadSites() {
      const res = await fetch('/api/admin/sites', { 
        headers: { 'Authorization': 'Bearer ' + token },
        cache: 'no-store' // 强制防缓存
      });
      siteData = await res.json();
      renderSites();
    }
    function renderSites() {
      const q = document.getElementById('siteSearch').value.toLowerCase().trim();
      const cat = document.getElementById('siteCat').value;
      let filtered = siteData;
      if (q) filtered = filtered.filter(i => i.title.toLowerCase().includes(q) || i.url.toLowerCase().includes(q));
      if (cat) filtered = filtered.filter(i => i.category_id == cat);

      document.getElementById('siteList').innerHTML = filtered.map(item => `
        <tr>
          <td>${item.id}</td>
          <td><div style="font-weight:600;">${item.title}</div><div style="font-size:12px;color:#6b7280;">${item.url}</div></td>
          <td>${item.category_name}</td>
          <td><span class="tag ${item.status === 'active' ? 'tag-published' : 'tag-inactive'}">${item.status === 'active' ? '正常展示' : '已下架'}</span></td>
          <td>
            <button class="btn btn-edit" onclick="openEdit(${item.id})">编辑</button>
            ${item.status === 'active' 
              ? `<button class="btn btn-danger" onclick="toggleStatus(${item.id}, 'invalid')">下架</button>`
              : `<button class="btn btn-success" onclick="toggleStatus(${item.id}, 'active')">上架</button>`}
          </td>
        </tr>`).join('');
    }

    function openEdit(id) {
      const item = siteData.find(s => s.id === id);
      if (!item) return;
      document.getElementById('editId').value = item.id;
      document.getElementById('editTitle').value = item.title;
      document.getElementById('editDesc').value = item.description;
      document.getElementById('editCat').value = item.category_id;
      document.getElementById('editStatus').value = item.status;
      document.getElementById('modal').style.display = 'flex';
    }

    async function saveEdit() {
      const payload = {
        id: parseInt(document.getElementById('editId').value),
        title: document.getElementById('editTitle').value,
        description: document.getElementById('editDesc').value,
        category_id: parseInt(document.getElementById('editCat').value),
        status: document.getElementById('editStatus').value
      };
      
      const res = await fetch('/api/admin/update-site', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        document.getElementById('modal').style.display = 'none';
        loadSites(); 
      } else { alert('保存失败'); }
    }

    async function toggleStatus(id, newStatus) {
      if (!confirm(`确定要将其状态改为 ${newStatus === 'active' ? '正常展示' : '隐藏下架'} 吗？`)) return;
      const res = await fetch('/api/admin/update-site', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ id, status: newStatus })
      });
      if (res.ok) loadSites();
      else alert('操作失败');
    }

    init();
  </script>
</body>
</html>
