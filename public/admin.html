<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>管理后台 - 导航map</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f7f9; padding: 20px; margin: 0; }
    .header-bar { max-width: 1200px; margin: 0 auto 10px; display: flex; justify-content: space-between; align-items: center; }
    .header-bar a { text-decoration: none; color: #2563eb; font-size: 14px; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
    .toolbar input { width: 300px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    th { background: #f9fafb; font-weight: 600; color: #374151; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-pass { background: #10b981; color: #fff; margin-right: 8px; }
    .btn-reject { background: #ef4444; color: #fff; }
    .btn:hover { opacity: 0.8; }
    .tag { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: 500; }
    .tag-pending { background: #fef3c7; color: #92400e; }
    .tag-published { background: #d1fae5; color: #065f46; }
    .tag-rejected { background: #fee2e2; color: #991b1b; }
    .tag-deleted { background: #f3f4f6; color: #4b5563; }
    .url-text { font-size: 12px; color: #6b7280; word-break: break-all; }
  </style>
</head>
<body>
  <div class="header-bar"><a href="/">← 返回首页</a></div>
  <div class="container">
    <h2>全部投稿记录及审核</h2>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜索网站名、URL、提交人账号..." />
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="pending">待审核</option>
        <option value="published">已发布</option>
        <option value="rejected">已拒绝</option>
        <option value="deleted">用户已撤回</option>
      </select>
      <select id="catFilter"><option value="">全部分类</option></select>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>网站信息</th><th>分类</th><th>提交人</th><th>提交时间</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/login.html';

    const statusMap = {
      'pending': '<span class="tag tag-pending">待审核</span>',
      'published': '<span class="tag tag-published">已发布</span>',
      'rejected': '<span class="tag tag-rejected">已拒绝</span>',
      'deleted': '<span class="tag tag-deleted">用户已撤回</span>'
    };

    let allData = [];

    async function init() {
      const cRes = await fetch('/api/categories');
      const categories = await cRes.json();
      const catSelect = document.getElementById('catFilter');
      categories.forEach(c => { catSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
      
      await loadList();
      
      document.getElementById('searchInput').addEventListener('input', renderTable);
      document.getElementById('statusFilter').addEventListener('change', renderTable);
      document.getElementById('catFilter').addEventListener('change', renderTable);
    }

    async function loadList() {
      const res = await fetch('/api/admin/submissions', { headers: { 'Authorization': 'Bearer ' + token } });
      if (res.status === 403) return alert('无权限访问');
      allData = await res.json();
      renderTable();
    }

    function renderTable() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const status = document.getElementById('statusFilter').value;
      const catId = document.getElementById('catFilter').value;
      
      let filtered = allData;
      if (q) filtered = filtered.filter(i => i.title.toLowerCase().includes(q) || i.url.toLowerCase().includes(q) || i.user_email.toLowerCase().includes(q));
      if (status) filtered = filtered.filter(i => i.status === status);
      if (catId) filtered = filtered.filter(i => i.category_id == catId);

      const tbody = document.getElementById('list');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无匹配记录</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(item => `
        <tr>
          <td>${item.id}</td>
          <td>
            <div style="font-weight:600; margin-bottom:4px;">${item.title}</div>
            <div class="url-text"><a href="${item.url}" target="_blank">${item.url}</a></div>
          </td>
          <td>${item.category_name}</td>
          <td>${item.user_email}</td>
          <td>${new Date(item.created_at).toLocaleString()}</td>
          <td>${statusMap[item.status] || item.status}</td>
          <td>
            ${item.status === 'pending' ? `
              <button class="btn btn-pass" onclick="review(${item.id}, 'pass')">通过</button>
              <button class="btn btn-reject" onclick="review(${item.id}, 'reject')">拒绝</button>
            ` : '-'}
          </td>
        </tr>
      `).join('');
    }

    async function review(id, action) {
      if (!confirm(`确定要${action === 'pass' ? '通过' : '拒绝'}吗？`)) return;
      const res = await fetch('/api/admin/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ submissionId: id, action })
      });
      if (res.ok) { alert('操作成功'); loadList(); } else { alert('操作失败'); }
    }
    init();
  </script>
</body>
</html>
